[package]
name = "sophie"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = {version = "1.18.0", features=["derive"]}
image = {version = "0.25.2", features=["png", "jpeg", "tga", "gif"]}
nalgebra = "0.33.0"
quickcheck = "1.0.3"
sdl2 = {version = "0.37.0", features=["bundled", "static-link", "raw-window-handle"]}
tokio = {version = "1.40.0", features=["rt", "macros", "rt-multi-thread", "fs"]}
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
wgpu = {version = "22.1.0", features=["dx12", "vulkan-portability", "metal", "glsl", "webgl"]}

[features]
default = ["sph-spanic"]
sph-spanic = []
